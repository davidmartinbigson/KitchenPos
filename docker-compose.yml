services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: app_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      # On the very first boot, postgres runs these SQL files and creates all tables.
      - ./drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/app_db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MASTER_ADMIN_EMAIL: ${MASTER_ADMIN_EMAIL:-davidmartinbigson@gmail.com}
      MASTER_ADMIN_PASSWORD: ${MASTER_ADMIN_PASSWORD:-ShAyAnAlI!123#}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
